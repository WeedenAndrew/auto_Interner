[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-interner"
version = "0.1.0"
description = "A privacy-conscious, AI-assisted internship and resume-tailoring pipeline."
readme = "README.md"
requires-python = ">=3.12,<3.15"
authors = [{ name = "Andrew Weeden" }]
license = "MIT"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
# lxml is imported directly by the DOCX assembler for OOXML scrubbing. It arrives
# transitively with python-docx, but a direct import needs a direct declaration.
dependencies = ["python-docx==1.2.0", "lxml==6.1.1"]

[project.optional-dependencies]
dev = [
  "mypy==2.3.1",
  "pytest==8.4.1",
  "pytest-cov==6.2.1",
  "ruff==0.12.9",
]
browser = ["selenium==4.46.0"]

[project.scripts]
auto-interner = "auto_interner.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
auto_interner = ["py.typed", "demo_data/*.json", "demo_data/*.docx"]

[tool.pytest.ini_options]
addopts = """
-ra
--strict-config
--strict-markers
-m "not live and not slow and not soak and not arm64"
"""
testpaths = ["tests"]
# Every marker below is either carried by tests in the default suite or names an
# opt-in gate that `addopts` deselects. Markers with neither role are not declared,
# so `-m <marker>` never implies coverage that does not exist.
markers = [
  # Scope
  "unit: isolated pure-function or class tests",
  "component: complete module tests with local fakes",
  "contract: adapter and schema boundary tests",
  "integration: tests of multiple local components",
  "e2e: complete offline pipeline tests",
  "acceptance: user-visible workflow tests",
  # Quality attributes
  "security: security behavior tests",
  "reliability: crash and recovery tests",
  "privacy: privacy boundary tests",
  "portability: cross-platform behavior tests",
  "observability: log and summary tests",
  # Opt-in gates, deselected by default; these intentionally have no default-suite members
  "live: opt-in external service tests",
  "browser: tests requiring Chromium",
  "arm64: tests requiring an arm64 target",
  "slow: tests excluded from the default suite",
  "soak: long-running reliability tests",
]

[tool.coverage.run]
branch = true
source = ["auto_interner"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
# Tests are checked too. Left out, the fakes drift from the protocols they stand
# in for: FakeModel took a dict where StructuredModelClient takes a Mapping, and
# a fake runner took `object` where PipelineRunner takes Iterable[Listing]. A
# fake looser than its contract passes its own test while hiding a real break.
files = ["src", "tests"]

# PyYAML is an optional corpus format, imported inside a try/except that raises
# a CorpusError telling the operator to install it or convert to JSON. Declaring
# types-PyYAML would add a dev dependency for a module that is deliberately not
# a dependency, so the stubs are waived instead.
[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
