name: Raspberry Pi arm64 validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arm64-${{ github.ref }}
  cancel-in-progress: false

jobs:
  arm64:
    name: Ubuntu arm64 / Raspberry Pi
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Run offline suite on arm64
        run: python -m pytest --cov=auto_interner --cov-branch --cov-fail-under=85

      - name: Prepare safe fixture configuration
        run: |
          cp .env.example .env
          mkdir -p runtime/data runtime/state

      - name: Validate and build arm64 image
        run: |
          test "$(uname -m)" = "aarch64"
          docker compose config --quiet
          docker compose build --pull worker

      - name: Verify non-root image user
        run: test "$(docker run --rm --entrypoint id auto-interner:local -u)" = "10001"

      - name: Run offline fixture smoke
        run: docker compose --profile tools run --rm smoke

      - name: Run offline browser smoke
        run: docker compose --profile tools run --rm browser-smoke
