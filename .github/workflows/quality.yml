name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Lint
        run: python -m ruff check .

      - name: Type check
        run: python -m mypy

      - name: Test with coverage
        run: python -m pytest --cov=auto_interner --cov-branch --cov-fail-under=85

  container:
    name: Linux container smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Prepare safe fixture configuration
        run: |
          cp .env.example .env
          mkdir -p runtime/data runtime/state

      - name: Validate Compose
        run: docker compose config --quiet

      - name: Build image
        run: docker compose build worker

      - name: Verify non-root image user
        run: test "$(docker run --rm --entrypoint id auto-interner:local -u)" = "10001"

      - name: Run offline fixture smoke
        run: docker compose --profile tools run --rm smoke

      - name: Run offline browser smoke
        run: docker compose --profile tools run --rm browser-smoke
