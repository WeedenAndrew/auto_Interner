name: auto-interner

services:
  worker:
    image: auto-interner:local
    build:
      context: .
      dockerfile: Dockerfile
    command: ["daemon"]
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 2m
    env_file:
      - path: ${AUTO_INTERNER_ENV_FILE:-.env}
        required: true
    environment:
      DATA_DIR: /app/data
      STATE_DIR: /app/state
      BROWSER_ENABLED: "true"
      CHROMIUM_BINARY: /usr/bin/chromium
      CHROMEDRIVER_PATH: /usr/bin/chromedriver
      BROWSER_NO_SANDBOX: "true"
      HEARTBEAT_PATH: /app/state/heartbeat.json
      HEALTHCHECK_MAX_AGE_SECONDS: ${HEALTHCHECK_MAX_AGE_SECONDS:-10800}
    volumes:
      - type: bind
        source: ${AUTO_INTERNER_DATA_DIR:-./runtime/data}
        target: /app/data
        bind:
          create_host_path: false
      - type: bind
        source: ${AUTO_INTERNER_STATE_DIR:-./runtime/state}
        target: /app/state
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /home/auto-interner/.cache:size=128m,uid=10001,gid=10001,mode=0700
    shm_size: 256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: ${AUTO_INTERNER_MEMORY_LIMIT:-1536m}
    mem_reservation: ${AUTO_INTERNER_MEMORY_RESERVATION:-256m}
    cpus: ${AUTO_INTERNER_CPUS:-2.0}
    healthcheck:
      test: ["CMD", "python", "-m", "auto_interner.healthcheck"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 2m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  smoke:
    image: auto-interner:local
    profiles: ["tools"]
    command:
      - run-once
      - --fixture
      - --write
      - --data-dir
      - /tmp/data
      - --state-dir
      - /tmp/state
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777,uid=10001,gid=10001
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 768m

  browser-smoke:
    image: auto-interner:local
    profiles: ["tools"]
    entrypoint: ["python", "-m", "auto_interner.browser_smoke"]
    environment:
      CHROMIUM_BINARY: /usr/bin/chromium
      CHROMEDRIVER_PATH: /usr/bin/chromedriver
      BROWSER_NO_SANDBOX: "true"
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /home/auto-interner/.cache:size=128m,uid=10001,gid=10001,mode=0700
    shm_size: 256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1024m
